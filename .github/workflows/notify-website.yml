name: Notify website

# Starts the website's "Build & deploy" (debikurnia/Havusweb), so havus.web.id shows new versions,
# download links and release notes right away instead of at its daily rebuild:
# - when a release is published, unpublished, edited or deleted. GitHub runs a release's workflows
#   from the commit its tag points to, so releases tagged before this file existed (0.1.0) don't
#   start it;
# - by hand (Actions → Notify website → Run workflow), to test the token, or to refresh the site
#   after editing one of those older releases.
#
# Needs the secret HAVUSWEB_DISPATCH_TOKEN: a fine-grained personal access token for
# debikurnia/Havusweb with only "Actions: Read and write". That's enough to start a workflow there,
# but not to change its code. Without the secret, a release only logs a notice; a run by hand fails.

on:
  release:
    types: [published, unpublished, edited, deleted]
  workflow_dispatch:

# The job brings its own token, so GITHUB_TOKEN gets no permissions.
permissions: {}

jobs:
  notify:
    name: Rebuild havus.web.id
    # Drafts never show on the website, but a release turned back into a draft has to disappear from it.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.action == 'unpublished' || !github.event.release.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start the website's Build & deploy
        env:
          GH_TOKEN: ${{ secrets.HAVUSWEB_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              echo "::error::HAVUSWEB_DISPATCH_TOKEN isn't set, so there's no way to start the website's build."
              exit 1
            fi
            echo "::notice::HAVUSWEB_DISPATCH_TOKEN isn't set, so havus.web.id picks this release up at its daily rebuild."
            exit 0
          fi
          gh api --method POST repos/debikurnia/Havusweb/actions/workflows/deploy.yml/dispatches -f ref=main
          echo "Started Build & deploy for havus.web.id."
