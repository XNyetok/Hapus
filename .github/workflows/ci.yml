name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Scan secret
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (seluruh riwayat)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pasang gitleaks (checksum diverifikasi)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan seluruh riwayat Git
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .

  build-test:
    name: Build & test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Versi toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test HapusCore
        run: swift test --package-path Packages/HapusCore

      - name: Build app (tanpa signing)
        run: |
          xcodebuild build \
            -project Hapus.xcodeproj \
            -scheme Hapus \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Cek format (informasi, nggak bikin gagal)
        continue-on-error: true
        run: xcrun swift-format lint --recursive Hapus Packages/HapusCore/Sources Packages/HapusCore/Tests
