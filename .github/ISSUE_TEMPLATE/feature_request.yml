name: Feature request
description: Have an idea to make Hapus more useful?
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: English is preferred, but Bahasa Indonesia is welcome too.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation first, then the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
  - type: textarea
    id: safety
    attributes:
      label: If it deletes files, why is that safe?
      description: "For example: the data is a cache that the owning app regenerates automatically. Include sources if you have them."
