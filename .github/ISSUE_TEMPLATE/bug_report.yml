name: Laporan bug
description: Ada yang nggak beres? Laporin di sini.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Makasih udah mau lapor! 🙏
        **Celah keamanan jangan dilaporin di sini**, ikutin [SECURITY.md](../blob/main/SECURITY.md) ya.
        Sebelum kirim, sensor dulu data pribadi: nama user di path (`/Users/...`), nama file pribadi, dan sejenisnya.
  - type: textarea
    id: what-happened
    attributes:
      label: Apa yang terjadi?
      description: Ceritain singkat masalahnya. Screenshot boleh banget.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Langkah buat ngulangin
      placeholder: |
        1. Buka Sampah Sistem
        2. Klik Pindai Sekarang
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Harusnya gimana?
  - type: input
    id: version
    attributes:
      label: Versi Hapus
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: Versi macOS
      placeholder: "macOS 15.4"
    validations:
      required: true
  - type: dropdown
    id: chip
    attributes:
      label: Jenis Mac
      options:
        - Apple Silicon
        - Intel
    validations:
      required: true
  - type: dropdown
    id: full-disk-access
    attributes:
      label: Akses Disk Penuh aktif?
      options:
        - "Ya"
        - "Nggak"
        - "Nggak tahu"
  - type: checkboxes
    id: privacy
    attributes:
      label: Privasi
      options:
        - label: Aku udah ngecek laporan ini nggak berisi data pribadi atau secret.
          required: true
