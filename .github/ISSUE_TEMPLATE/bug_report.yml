name: Bug report
description: Something not working right? Let us know.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! English is preferred, but Bahasa Indonesia is welcome too.
        **Please don't report security vulnerabilities here**; follow [SECURITY.md](../blob/main/SECURITY.md) instead.
        Before submitting, redact personal data such as your username in paths (`/Users/...`) and private file names.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem briefly. Screenshots are welcome.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open "System Junk" ("Sampah Sistem")
        2. Click "Scan Now" ("Pindai Sekarang")
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: input
    id: version
    attributes:
      label: Havus version
      description: Shown under Havus → About Havus.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 15.4"
    validations:
      required: true
  - type: dropdown
    id: chip
    attributes:
      label: Mac type
      options:
        - Apple silicon
        - Intel
    validations:
      required: true
  - type: dropdown
    id: full-disk-access
    attributes:
      label: Is Full Disk Access enabled for Havus?
      options:
        - "Yes"
        - "No"
        - "Not sure"
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I checked that this report contains no personal data or secrets.
          required: true
